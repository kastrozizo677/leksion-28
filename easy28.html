<!DOCTYPE html>
<html>
<head>
    <title>EASY CHALLENGE</title>
</head>
<body>
    <p id="myText">Click the button to turn me red.</p>
    <button id="colorBtn">Make it red</button>

    <script>
    document.getElementById("colorBtn").addEventListener("click", () => {
        document.getElementById("myText").style.color = "red";
    });
    </script>
</body>
</html>
