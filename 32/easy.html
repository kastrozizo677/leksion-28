<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Name Input Validation</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
    }

    .form-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    input[type="text"] {
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }

    input[type="text"].invalid {
      border-color: #d32f2f;
    }

    .error-message {
      color: #d32f2f;
      font-size: 0.875rem;
      display: none;
    }

    .error-message.visible {
      display: inline;
    }
  </style>
</head>
<body>

  <form id="nameForm">
    <div class="form-group">
      <label for="userName">Name:</label>
      <input 
        type="text" 
        id="userName" 
        name="userName" 
        autocomplete="off"
        aria-describedby="nameError"
      >
      <span id="nameError" class="error-message" role="alert">
        Only letters are allowed.
      </span>
    </div>
  </form>

  <script>
    const nameInput = document.getElementById('userName');
    const nameError = document.getElementById('nameError');

    // Matches strings containing exclusively Unicode letter characters and optional spaces
    const letterPattern = /^[\p{L}\s]*$/u;

    nameInput.addEventListener('input', () => {
      const isValid = letterPattern.test(nameInput.value);

      if (!isValid) {
        nameError.classList.add('visible');
        nameInput.classList.add('invalid');
      } else {
        nameError.classList.remove('visible');
        nameInput.classList.remove('invalid');
      }
    });
  </script>

</body>
</html>
