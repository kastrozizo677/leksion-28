<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Embedding JavaScript Example</title>
</head>
<body>

  <h1>Hello World</h1>
  <p id="message">This is a paragraph.</p>

  <!-- Embedded JavaScript -->
  <script>
    const messageElement = document.getElementById("message");
    messageElement.textContent = "This text was changed by embedded JavaScript!";
  </script>

</body>
</html>
